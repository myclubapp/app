name: PROD - Build myclub Apps and Deploy on Firebase Hosting
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      apps:
        description: 'Nur diese Apps deployen (Komma-getrennt, leer = alle)'
        required: false
        default: ''

jobs:
  # -------------------------------------------------------------
  # Unit Tests
  # -------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Konfigurations-Drift prüfen
        run: npm run themes:check
      - name: Run Unit Tests
        run: npx ng test --no-watch --browsers=ChromeHeadless --code-coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
      - name: Publish Test Results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Karma Test Results
          path: TESTS-*.xml
          reporter: java-junit
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - name: Generate Coverage Badge
        uses: jaywcjlove/coverage-badges-cli@main
        if: always()
        with:
          source: coverage/ngv/coverage-summary.json
          output: coverage/ngv/badge.svg
      - name: Deploy Badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage/ngv
          destination_dir: coverage

  # -------------------------------------------------------------
  # App-Matrix aus themes.config.json ableiten
  # -------------------------------------------------------------
  resolve_apps:
    name: Apps ermitteln
    needs: test
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.resolve.outputs.apps }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Matrix aufbauen
        id: resolve
        env:
          ONLY: ${{ github.event.inputs.apps }}
        run: |
          if [ -n "$ONLY" ]; then
            APPS=$(node tools/ci-matrix.mjs main --only "$ONLY")
          else
            APPS=$(node tools/ci-matrix.mjs main)
          fi
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Matrix: $APPS"

  # -------------------------------------------------------------
  # Build & Deploy pro App
  # -------------------------------------------------------------
  deploy:
    name: ${{ matrix.app.label }}
    needs: resolve_apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.resolve_apps.outputs.apps) }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build ${{ matrix.app.label }}
        run: npx ng build --configuration ${{ matrix.app.configuration }}
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v12.8.0
        with:
          args: deploy --only hosting:${{ matrix.app.hostingTarget }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
